name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }    # declared minimum
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
      - name: Prepare
        run: |
          python -m pip install --quiet pyyaml        # enables the strict YAML frontmatter check
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Validate (full suite)
        run: bash scripts/validate.sh
